# Ejercicio A - Lamport: 4 "computadoras" (contenedores), orden P1 -> P2 -> P3 -> P4
# Uso: docker compose up --build      (los logs quedan en ./logs)
# Cada proceso tiene un reloj fisico desfasado y algunos arrancan con eventos
# locales previos, para que se vean los dos casos de la regla de recepcion.

x-proc: &proc
  build:
    context: ..
    dockerfile: Dockerfile
  image: tp5-sincronizacion-cpp
  volumes:
    - ./logs:/app/logs
  networks: [lamport-net]

services:
  p1:
    <<: *proc
    container_name: lamport-p1
    command: lamport --id 1 --port 6001 --next p2:6001 --rounds 2 --offset-s 0 --initial-events 0
  p2:
    <<: *proc
    container_name: lamport-p2
    command: lamport --id 2 --port 6001 --next p3:6001 --rounds 2 --offset-s -3 --initial-events 0
  p3:
    <<: *proc
    container_name: lamport-p3
    command: lamport --id 3 --port 6001 --next p4:6001 --rounds 2 --offset-s 5 --initial-events 6
  p4:
    <<: *proc
    container_name: lamport-p4
    command: lamport --id 4 --port 6001 --next p1:6001 --rounds 2 --offset-s -2 --initial-events 1

networks:
  lamport-net:
